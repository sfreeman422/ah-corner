services:
  app:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REQUIRE_DATABASE: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    # Lets DATABASE_URL use host.docker.internal when MySQL/MariaDB is on this Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
