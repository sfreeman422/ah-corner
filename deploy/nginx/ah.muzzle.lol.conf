# Initial HTTP vhost for AH Corner. Certbot will add the HTTPS listener and
# redirect after: certbot --nginx --redirect -d ah.muzzle.lol
server {
    listen 80;
    server_name ah.muzzle.lol;

    # Let the application return its own clear 2 MB import-size error.
    client_max_body_size 3m;

    # Keep ACME challenges reachable when HTTP Basic Auth is enabled below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        # The application has no login of its own; keep this required before
        # exposing the dashboard publicly.
        auth_basic "AH Corner";
        auth_basic_user_file /etc/nginx/.htpasswd-ah-corner;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3003;
    }
}
